name: Extract Xiaobang App Code

on:
  push:
    paths:
      - '.github/workflows/download-xiaobang.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download APK
        shell: bash
        run: |
          set -euxo pipefail
          urls=(
            "https://z85.198274.com//6/com.bytedance.lifeservice.crm.apk"
            "https://jxz3.tqqyun.com/apk/com.bytedance.lifeservice.crm.apk"
            "https://9az.197784.com/9az14/com.bytedance.lifeservice.crm.apk"
          )
          ok=0
          for url in "${urls[@]}"; do
            rm -f app.apk
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 -A "Mozilla/5.0" -o app.apk "$url"; then
              if [ "$(stat -c%s app.apk)" -gt 1000000 ] && unzip -t app.apk >/dev/null 2>&1; then
                ok=1
                break
              fi
            fi
          done
          test "$ok" -eq 1

      - name: Decode with apktool
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y apktool
          apktool d -f app.apk -o decoded

      - name: Extract app-specific code and route evidence
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out/app-smali out/evidence
          shopt -s nullglob
          for root in decoded/smali decoded/smali_classes*; do
            src="$root/com/bytedance/lifeservice/crm"
            if [ -d "$src" ]; then
              dst="out/app-smali/$(basename "$root")"
              mkdir -p "$dst"
              cp -R "$src" "$dst/"
            fi
          done

          grep -RniE --include='*.smali' \
            'TabBarModuleWidget|MainPageActivity|MainActivity|ls_selector_(home|customer|data|message|new_open|order|me)|openMyPage|tab_bar|schema|lynx|bullet|客户|首页|数据|消息|开店|订单|我的|拜访|业绩' \
            out/app-smali > out/evidence/app-code-hits.txt || true

          find out/app-smali -type f -name '*.smali' | sort > out/evidence/file-list.txt
          {
            echo '=== likely tab-bar files ==='
            find out/app-smali -type f -path '*tab_bar*' -name '*.smali' -print
            echo
            echo '=== main activity files ==='
            find out/app-smali -type f \( -name 'MainActivity*.smali' -o -name 'MainPageActivity*.smali' \) -print
          } > out/evidence/key-files.txt

          tar -czf xiaobang-app-code.tar.gz out

      - name: Upload app code
        uses: actions/upload-artifact@v4
        with:
          name: xiaobang-app-code
          path: xiaobang-app-code.tar.gz
          if-no-files-found: error
          retention-days: 1
