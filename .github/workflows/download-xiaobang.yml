name: Decode Xiaobang APK

on:
  push:
    paths:
      - '.github/workflows/download-xiaobang.yml'
  workflow_dispatch:

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download APK from mirrors
        shell: bash
        run: |
          set -euxo pipefail
          urls=(
            "https://z85.198274.com//6/com.bytedance.lifeservice.crm.apk"
            "https://jxz3.tqqyun.com/apk/com.bytedance.lifeservice.crm.apk"
            "https://9az.197784.com/9az14/com.bytedance.lifeservice.crm.apk"
          )
          ok=0
          for url in "${urls[@]}"; do
            echo "Trying $url"
            rm -f douyin_xiaobang.apk
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
              -A "Mozilla/5.0" \
              -o douyin_xiaobang.apk "$url"; then
              size=$(stat -c%s douyin_xiaobang.apk)
              echo "Downloaded $size bytes"
              if [ "$size" -gt 1000000 ] && unzip -t douyin_xiaobang.apk >/dev/null 2>&1; then
                ok=1
                break
              fi
            fi
          done
          test "$ok" -eq 1
          md5sum douyin_xiaobang.apk | tee md5.txt

      - name: Install apktool
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y apktool

      - name: Decode APK resources
        shell: bash
        run: |
          set -euxo pipefail
          apktool d -f douyin_xiaobang.apk -o decoded
          mkdir -p package selected_assets
          cp decoded/AndroidManifest.xml package/
          cp decoded/apktool.yml package/
          cp md5.txt package/
          cp -R decoded/res package/res

          while IFS= read -r -d '' f; do
            rel="${f#decoded/}"
            mkdir -p "selected_assets/$(dirname "$rel")"
            cp "$f" "selected_assets/$rel"
          done < <(find decoded/res -type f \( -name 'ls_*' -o -name 'lsm_*' -o -name 'enterprise_*' \) -print0)

          {
            echo '=== Manifest app package ==='
            grep -nE 'package=|versionName|versionCode|application|activity|service' decoded/AndroidManifest.xml | head -n 400 || true
            echo
            echo '=== App-specific resource refs ==='
            grep -RniE 'ls_customer|ls_data|ls_home|ls_message|ls_new_open|ls_order|activity_homepage|share_name_card|SplashActivity|lifeservice.crm' decoded/res decoded/AndroidManifest.xml | head -n 1200 || true
            echo
            echo '=== Main layouts ==='
            find decoded/res -type f -path '*/layout*/*' | sed 's#decoded/##' | sort
          } > package/ui-analysis.txt

          tar -czf xiaobang-decoded-resources.tar.gz package selected_assets

      - name: Upload decoded resources
        uses: actions/upload-artifact@v4
        with:
          name: xiaobang-decoded-resources
          path: xiaobang-decoded-resources.tar.gz
          if-no-files-found: error
          retention-days: 1
