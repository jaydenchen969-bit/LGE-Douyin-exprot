name: Download Xiaobang APK

on:
  push:
    paths:
      - '.github/workflows/download-xiaobang.yml'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download APK from mirrors
        shell: bash
        run: |
          set -euxo pipefail
          urls=(
            "https://z85.198274.com//6/com.bytedance.lifeservice.crm.apk"
            "https://jxz3.tqqyun.com/apk/com.bytedance.lifeservice.crm.apk"
            "https://9az.197784.com/9az14/com.bytedance.lifeservice.crm.apk"
          )
          ok=0
          for url in "${urls[@]}"; do
            echo "Trying $url"
            rm -f douyin_xiaobang.apk
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
              -A "Mozilla/5.0" \
              -o douyin_xiaobang.apk "$url"; then
              size=$(stat -c%s douyin_xiaobang.apk)
              echo "Downloaded $size bytes"
              if [ "$size" -gt 1000000 ] && unzip -t douyin_xiaobang.apk >/dev/null 2>&1; then
                ok=1
                break
              fi
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "No mirror produced a valid APK"
            exit 1
          fi
          md5sum douyin_xiaobang.apk | tee md5.txt
          sha256sum douyin_xiaobang.apk | tee sha256.txt
          file douyin_xiaobang.apk | tee file-info.txt
          unzip -l douyin_xiaobang.apk | head -n 200 > apk-list-head.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: douyin-xiaobang-apk
          path: |
            douyin_xiaobang.apk
            md5.txt
            sha256.txt
            file-info.txt
            apk-list-head.txt
          if-no-files-found: error
          retention-days: 1
