name: Inspect Xiaobang Public UI
on:
  push:
    paths:
      - '.github/workflows/inspect-xiaobang-public-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Capture published UI documents and directly linked JS and CSS
        shell: bash
        run: |
          mkdir -p out/documents out/assets
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, re, urllib.request, urllib.error, urllib.parse
          from html.parser import HTMLParser
          ROOT=pathlib.Path('out')
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='script' and a.get('src'): self.links.append(a['src'])
                  if tag=='link' and a.get('href') and (a.get('rel')=='stylesheet' or a.get('as') in ('script','style')): self.links.append(a['href'])
          def get(url,dest):
              result={'requested_url':url,'local_file':str(dest),'authenticated':False}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 Chrome/120.0.0.0 Mobile Safari/537.36'})
                  with urllib.request.urlopen(req,timeout=22) as r:
                      data=r.read(12000001)
                      result.update(status=r.status,final_url=r.url,content_type=r.headers.get('Content-Type',''),bytes=len(data))
                      if len(data)>12000000: result['error']='exceeds 12 MB limit'; return result,None
                      dest.write_bytes(data);result['sha256']=hashlib.sha256(data).hexdigest();return result,data
              except urllib.error.HTTPError as e: result.update(status=e.code,error=str(e),final_url=e.url)
              except Exception as e: result['error']=str(e)
              return result,None
          docs=[];assets=set()
          def document(name,url):
              result,data=get(url,ROOT/'documents'/f'{name}.html');result['app_name']=name
              if data and 'html' in result.get('content_type',''):
                  parser=Links();parser.feed(data.decode('utf8','replace'))
                  for link in parser.links:
                      u=urllib.parse.urljoin(result.get('final_url',url),link);parts=urllib.parse.urlsplit(u)
                      if parts.scheme=='https' and not re.search(r'/(api|passport|oauth)/',parts.path) and re.search(r'\.(js|css)(?:$|\?)',u):assets.add(u)
              return result,data
          main,data=document('main','https://crm.dylk.com/m/app');docs.append(main)
          modules=[]
          if data:
              match=re.search(r'window\.gfdatav1=(\{.*?\})</script>',data.decode('utf8','replace'),re.S)
              if match:modules=json.loads(match.group(1)).get('garrModules',{}).get('data',[])
          (ROOT/'micro-apps.json').write_text(json.dumps(modules,ensure_ascii=False,indent=2))
          targets={'home-page','crm','crm_region','data','utilities'}
          for app in modules:
              if app['name'] not in targets:continue
              url=urllib.parse.urljoin('https://crm.dylk.com',app['source_url'])
              result,_=document(app['name'],url);result['declared_version']=app.get('version');docs.append(result)
          candidates=sorted(assets)
          assets=candidates[:160]
          def asset(item):
              i,url=item;ext='.css' if '.css' in urllib.parse.urlsplit(url).path else '.js'
              r,_=get(url,ROOT/'assets'/f'{i:03d}{ext}');return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:results=list(pool.map(asset,enumerate(assets)))
          manifest={'mode':'anonymous_public_static_resources_only','documents':docs,'assets':results,'asset_candidates':len(candidates),'asset_cap':160,'unfetched_due_to_cap':candidates[160:],'not_attempted':['login','business APIs','token acquisition','internal environments','authentication bypass','font downloads']}
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print(json.dumps({'documents':[(x['app_name'],x.get('status'),x.get('error')) for x in docs],'assets':len(results),'successful_assets':sum(x.get('status')==200 for x in results),'bytes':sum(x.get('bytes',0) for x in results)},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xiaobang-micro-ui-assets
          path: out
          retention-days: 7
          if-no-files-found: error
