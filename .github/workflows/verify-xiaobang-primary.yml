name: Verify Xiaobang Primary Flow
on:
  push:
    paths: ['.github/workflows/verify-xiaobang-primary.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Retrieve pinned APK and prepare Android 11 test device
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for u in 'https://z85.198274.com//6/com.bytedance.lifeservice.crm.apk' 'https://jxz3.tqqyun.com/apk/com.bytedance.lifeservice.crm.apk' 'https://9az.197784.com/9az14/com.bytedance.lifeservice.crm.apk'; do
            curl -fL --connect-timeout 15 --max-time 150 -A Mozilla/5.0 -o app.apk "$u" || continue
            echo 'ff701dd9d5653954211340c57f0476cf060a8e830ca6e114e645ab4c939ab5a0  app.apk' | sha256sum -c - && break
          done
          echo 'ff701dd9d5653954211340c57f0476cf060a8e830ca6e114e645ab4c939ab5a0  app.apk' | sha256sum -c -
          test -c /dev/kvm && sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-30;google_apis;x86_64' 'platform-tools' 'emulator' >out/sdk-install.log 2>&1
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n xb-ui -k 'system-images;android-30;google_apis;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -avd xb-ui -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -cores 2 -memory 2048 >out/emulator.log 2>&1 &
          echo $! >out/emulator.pid
          adb wait-for-device
          for i in $(seq 1 90); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb root; sleep 2; adb wait-for-device
          adb shell svc wifi disable; adb shell svc data disable
          adb shell iptables -I OUTPUT 1 -j REJECT
          adb shell ip6tables -I OUTPUT 1 -j REJECT
          adb shell iptables -S OUTPUT >out/network-isolation.txt
          adb shell ip6tables -S OUTPUT >>out/network-isolation.txt
          adb shell wm size 780x1688; adb shell wm density 320
          adb shell settings put system font_scale 1.0
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
          adb shell getprop >out/device-properties.txt
          adb install app.apk >out/install.txt 2>&1
      - name: Capture local prelogin screens only; no account or SMS
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,time,pathlib,json,re,xml.etree.ElementTree as ET
          out=pathlib.Path('out'); events=[]; package='com.bytedance.lifeservice.crm'
          def adb(*args, timeout=30):
              return subprocess.run(['adb',*args],capture_output=True,timeout=timeout)
          def snap(name):
              data=adb('exec-out','screencap','-p').stdout
              (out/(name+'.png')).write_bytes(data)
              adb('shell','uiautomator','dump','/sdcard/xb-window.xml')
              xml=adb('exec-out','cat','/sdcard/xb-window.xml').stdout
              (out/(name+'.xml')).write_bytes(xml)
              try:return ET.fromstring(xml)
              except Exception:return None
          def tap(tree, labels):
              if tree is None:return False
              for node in tree.iter('node'):
                  if node.attrib.get('text') in labels:
                      nums=list(map(int,re.findall(r'\d+',node.attrib.get('bounds',''))))
                      if len(nums)==4:
                          x1,y1,x2,y2=nums;adb('shell','input','tap',str((x1+x2)//2),str((y1+y2)//2));events.append({'action':'tap','label':node.attrib['text'],'local_test_only':True});time.sleep(1);return True
              return False
          def launch():
              adb('shell','am','force-stop',package)
              adb('shell','monkey','-p',package,'-c','android.intent.category.LAUNCHER','1')
              time.sleep(1)
          launch();tree=snap('01-launch');time.sleep(3);tree=snap('02-prelogin')
          if tap(tree,['不同意']):
              tree=snap('03-privacy-retain')
              if tap(tree,['放弃使用']):
                  snap('04-local-exit');launch();time.sleep(2);tree=snap('05-relaunch')
          # This is an isolated, network-denied, unregistered test installation. No user account is used.
          if tap(tree,['同意','同意并继续']):tree=snap('06-identity')
          if tap(tree,['服务商员工','服务商员工登录']):
              tree=snap('07-partner-phone');adb('shell','input','keyevent','4');time.sleep(1);tree=snap('08-back')
          if tap(tree,['字节跳动员工','字节跳动员工登录']):
              tree=snap('09-employee')
              if tap(tree,['使用SSO登录']):snap('10-sso')
          (out/'events.json').write_text(json.dumps({'events':events,'no_account':True,'no_sms':True,'network':'guest IPv4 and IPv6 OUTPUT rejected before app launch','apk_sha256':'ff701dd9d5653954211340c57f0476cf060a8e830ca6e114e645ab4c939ab5a0','scope':'prelogin native render only'},ensure_ascii=False,indent=2))
          (out/'logcat.txt').write_bytes(adb('logcat','-d').stdout)
          (out/'activity.txt').write_bytes(adb('shell','dumpsys','activity','activities').stdout)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xiaobang-native-prelogin-verification
          path: out
          retention-days: 7
  perf-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Archive source-declared public performance HTML and direct static dependencies
        run: |
          mkdir -p perf/documents perf/assets
          python3 - <<'PY'
          import urllib.request,urllib.parse,hashlib,pathlib,json,re
          from html.parser import HTMLParser
          root=pathlib.Path('perf');manifest=[]
          class Links(HTMLParser):
              def __init__(self):super().__init__();self.urls=[]
              def handle_starttag(self,t,a):
                  a=dict(a)
                  if t=='script' and a.get('src'):self.urls.append(a['src'])
                  if t=='link' and a.get('href') and a.get('rel')=='stylesheet':self.urls.append(a['href'])
          def fetch(u,path):
              row={'url':u,'file':str(path),'authenticated':False}
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=18) as r:
                      data=r.read(12000001)
                      if len(data)>12000000:raise ValueError('Size limit')
                      path.write_bytes(data);row.update(status=r.status,final_url=r.url,sha256=hashlib.sha256(data).hexdigest(),bytes=len(data));manifest.append(row);return data
              except Exception as e:row['error']=str(e);manifest.append(row);return b''
          u='https://crm.dylk.com/m/perf/management';html=fetch(u,root/'documents/management.html');p=Links();p.feed(html.decode('utf8','replace'))
          for i,url in enumerate(sorted(set(urllib.parse.urljoin(u,x) for x in p.urls))[:32]):
              v=urllib.parse.urlsplit(url)
              if v.scheme!='https' or re.search('/(api|passport|oauth)/',v.path):continue
              if not v.path.endswith(('.js','.css')):continue
              fetch(url,root/'assets'/f'{i:03d}{pathlib.Path(v.path).suffix}')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xiaobang-performance-public-entry
          path: perf
          retention-days: 7
